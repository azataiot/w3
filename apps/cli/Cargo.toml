[package]
name = "w3-cli"
description = "A fast CLI for git worktrees, built for humans and coding agents who work on many branches at once."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "w3"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
w3.workspace = true

[dev-dependencies]
tempfile = "3"

[package.metadata.dist]
formula = "w3"

[package.metadata.release]
pre-release-replacements = [
  { file = "../../README.md", search = "releases/download/v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.]+)?/w3-cli-installer\\.sh", replace = "releases/download/v{{version}}/w3-cli-installer.sh", exactly = 1, prerelease = true },
  { file = "../../README.md", search = "w3-cli --version [0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.]+)?", replace = "w3-cli --version {{version}}", exactly = 1, prerelease = true },
]
